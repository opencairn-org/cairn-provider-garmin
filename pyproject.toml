[project]
name = "cairn-provider-garmin"
version = "0.7.1"
description = "Cairn worker that imports Garmin Connect activities and daily health metrics"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "cairn-provider-sdk>=0.7.1,<0.8",
    "garminconnect>=0.2.19",
    "protobuf>=7.35",
]

[dependency-groups]
dev = [
    "deptry",
    "mutmut>=3.8.0",
    "mypy",
    "nats-py>=2.7.0",  # the permission test drives NATS directly; the worker itself goes through the SDK
    "nkeys>=0.2.1",
    "pip-audit",
    "pip-licenses",
    "pylint>=4.1.3",
    "pytest",
    "pytest-cov",
    "ruff",
    "types-protobuf>=7.35.1.20260906",
]

[tool.uv]
# A service, not a library: dependencies only, code runs from the checkout.
package = false

[tool.uv.sources]
# The wheel of the SDK's GitHub release (not on PyPI); uv.lock holds its hash.
cairn-provider-sdk = { url = "https://github.com/opencairn-org/cairn-provider-sdk-python/releases/download/v0.7.1/cairn_provider_sdk-0.7.1-py3-none-any.whl" }

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "BLE", "S", "PT", "ASYNC", "C90", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["cairn_garmin", "tests"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["cairn_garmin", "tests"]
explicit_package_bases = true

[[tool.mypy.overrides]]
# garminconnect, garth and nkeys ship no type information.
module = ["garminconnect", "garminconnect.*", "garth", "garth.*", "nkeys"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["cairn_garmin"]
branch = true

[tool.coverage.report]
# main.py (signal wiring) is the only untested module.
fail_under = 85
show_missing = true
skip_covered = true

[tool.deptry]
known_first_party = ["cairn_garmin", "tests"]

[tool.deptry.package_module_name_map]
# The SDK distribution ships the contract stubs as the top-level package `cairn` too.
cairn-provider-sdk = ["cairn_provider_sdk", "cairn"]

[tool.mutmut]
# `make mutate`: weekly in CI, not part of check. main.py is signal wiring with no unit tests.
source_paths = ["cairn_garmin/"]
pytest_add_cli_args_test_selection = ["tests/"]
do_not_mutate = ["cairn_garmin/main.py"]

[tool.pylint.main]
# Only the duplication check; ruff covers everything else (`make lint`).
disable = ["all"]
enable = ["duplicate-code"]

[tool.pylint.similarities]
min-similarity-lines = 8
ignore-imports = true
