# .fleetlint.yaml: https://github.com/fleetlint/fleetlint
version: 1
extends:
  - fleetlint:recommended
facts:
  visibility: public   # as the forge reported it at init; update it if the repository changes hands
# discovered: stacks=[python] forge=github visibility=public tier=1 (default) layout=single release=yes taskrunner=none container=none
# Facts are re-detected on every run; pin one under `facts:` only when detection is wrong.
overrides:
  changelog/generator-configured:
    enabled: false
    reason: "CHANGELOG.md is curated by hand (Keep a Changelog); `make release` refuses a tag without its section"
  release/api-compatibility:
    enabled: false
    reason: "a service, not a library (tool.uv.package = false): its API is the Cairn worker protocol, checked for breaking changes in cairn-core (buf breaking)"
